name: NU-87 IMU flash bundle

on:
  workflow_dispatch:
  push:
    branches: [feat/nu87-imu-bringup]
    paths:
      - firmware/nu87_imu_bringup/**
      - tools/nu87_imu/**
      - tools/nu87_flash/**
      - patches/**
      - docs/imu-*.md
      - .github/workflows/nu87-imu-bundle.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: micro-wallaby
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test portable IMU logic and package guards
        run: |
          make -C micro-wallaby/firmware/nu87_imu_bringup/tests/host test
          python -m unittest discover -s micro-wallaby/tools/nu87_imu -v
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: micro-wallaby
          sdk-version: "1.0.1"
          toolchains: arm-zephyr-eabi
      - name: Prepare full Realtek images
        run: |
          micro-wallaby/tools/apply_west_patches.sh
          west blobs fetch hal_realtek
          python -m pip install -r modules/hal/realtek/ameba/scripts/requirements.txt
          python -m pip install 'python-mbedtls==2.10.1'
      - name: Build flashable NU-87 IMU image
        shell: bash
        run: |
          imu_sdk="$GITHUB_WORKSPACE/zephyr-sdk"
          imu_compat=$(mktemp -d)
          ln -s "$imu_sdk/gnu/arm-zephyr-eabi" "$imu_compat/arm-zephyr-eabi"
          ZEPHYR_TOOLCHAIN_VARIANT=zephyr ZEPHYR_SDK_INSTALL_DIR="$imu_compat" \
          west build -b nucode_nu87 micro-wallaby/firmware/nu87_imu_bringup \
            -d build/nu87-imu -- \
            -DZEPHYR_SDK_INSTALL_DIR="$imu_sdk" \
            -DCMAKE_GDB="$imu_sdk/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb" \
            -DEXTRA_CONF_FILE=program.conf
      - name: Package only images, uploader script, guides and license notices
        run: |
          python micro-wallaby/tools/nu87_imu/package.py \
            --build-dir build/nu87-imu --zephyr-dir zephyr \
            --hal-dir modules/hal/realtek --sdk-dir zephyr-sdk --output-dir artifacts
      - name: Upload Mac flashing bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: nu87-imu-macos
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Link bundle in run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download Mac flashing bundle]($ARTIFACT_URL). Hardware verification is pending." >> "$GITHUB_STEP_SUMMARY"
