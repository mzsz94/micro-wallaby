name: host logic

on:
  push:
    branches:
      - "feat/m0-nu87-io-validation"
  pull_request:

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run portable logic tests
        run: make -C firmware/nu87_io_bringup/tests/host test

  zephyr-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: micro-wallaby
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up pinned Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: micro-wallaby
          toolchains: arm-zephyr-eabi
      - name: Build fixture A
        run: >-
          west build -b nucode_nu87
          micro-wallaby/firmware/nu87_io_bringup
          -d build/nu87-fixture-a --
          -DDTC_OVERLAY_FILE=boards/nucode_nu87_fixture_a.overlay
          -DEXTRA_CONF_FILE=fixture_a.conf
      - name: Build fixture B
        run: >-
          west build -b nucode_nu87
          micro-wallaby/firmware/nu87_io_bringup
          -d build/nu87-fixture-b --
          -DDTC_OVERLAY_FILE=boards/nucode_nu87_fixture_b.overlay
          -DEXTRA_CONF_FILE=fixture_b.conf
