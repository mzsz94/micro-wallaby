# Copy this file to wifi.conf. wifi.conf is ignored by Git.
# Use a 2.4 GHz AP isolated from the home LAN and Internet.
CONFIG_MW_WIFI_SSID="YOUR_ISOLATED_2_4_GHZ_TEST_SSID"
CONFIG_MW_WIFI_PSK=""
CONFIG_MW_WIFI_SECURITY_OPEN=y

# A disposable WPA2 test credential requires both explicit settings below.
# The current AmebaD port has no verified cryptographic entropy source.
# CONFIG_MW_WIFI_SECURITY_PSK=y
# CONFIG_MW_WIFI_PSK="DISPOSABLE_TEST_PASSWORD"
# CONFIG_MW_ALLOW_INSECURE_TEST_PSK=y
