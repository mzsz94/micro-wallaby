# Core and diagnostics
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PINCTRL=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Native IPv4 networking and Ameba station mode
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_WIFI_AMEBA=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_RTK_WIFI_STA_AUTO_DHCPV4=y
# Realtek's single-core Wi-Fi archive places DMA descriptors in .nocache.data.
CONFIG_NOCACHE_MEMORY=y

# HTTP/1.1 and WebSocket only. HTTP/2 would add RAM/flash cost without helping
# the single-browser, local-network PoC.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_1=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_STACK_SIZE=3072
CONFIG_POSIX_API=y
CONFIG_ZVFS_POLL_MAX=8

# Sized from Zephyr's Ameba Wi-Fi shell sample, then reduced to the number of
# connections needed by one page, one status request and one WebSocket.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
# Native TCP keeps queued data while constructing a packet for transmission.
# Zephyr's minimum 1280-byte send window therefore needs more than 20
# 128-byte TX buffers; 32 also leaves headroom for the HTTP/WebSocket service.
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
