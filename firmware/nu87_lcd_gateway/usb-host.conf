# USB owns the API; initialize the shared RF without joining an access point.
CONFIG_GATEWAY_USB_HOST=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# API frames and deferred log lines must not interleave on the console.
CONFIG_LOG_BACKEND_UART=n
# The vendor empty-EFUSE prompt uses printk and must remain visible at startup.
CONFIG_LOG_PRINTK=n
