CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# HTTP parsing and the vendor's synchronous Wi-Fi transmit path share main.
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ASSERT=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
# The application's Wi-Fi state machine owns disconnect/retry transitions.
CONFIG_NET_CONNECTION_MANAGER_AUTO_IF_DOWN=n
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_WIFI_AMEBA=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_RTK_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NOCACHE_MEMORY=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
CONFIG_BT_SHELL=n
CONFIG_REALTEK_AMEBA_ZEPHYR_BT=y
CONFIG_BT_COEXIST=y
# Realtek's internal HCI UART uses dynamic IRQ registration.
CONFIG_DYNAMIC_INTERRUPTS=y
# This AmebaD port has no verified hardware entropy source. Bring-up only.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="MZSZ-LCD-Gateway"
CONFIG_THREAD_NAME=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
# The LCD protocol and legacy Nordic DFU both use <=20-byte writes.
CONFIG_BT_L2CAP_TX_MTU=23
CONFIG_BT_BUF_ACL_RX_SIZE=27
