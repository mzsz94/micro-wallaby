# Copy to ignored local.conf and fill in values. Default stays unconfigured.
# Use only an isolated test AP: the pinned AmebaD port lacks verified entropy.
CONFIG_GATEWAY_WIFI_SSID=""
CONFIG_GATEWAY_WIFI_SECURITY_OPEN=y
CONFIG_GATEWAY_API_TOKEN=""
# Explicit peer identity required; a matching advertised name is insufficient.
CONFIG_GATEWAY_PEER_ADDRESS=""
CONFIG_GATEWAY_PEER_ADDRESS_TYPE="random"
# Empty means the bootloader must have exactly the same address/type.
# Official unbonded legacy bootloaders commonly increment the last address byte.
# Inspect the bootloader identity and configure it explicitly; no automatic
# address arithmetic or name-only trust is performed by this gateway.
CONFIG_GATEWAY_DFU_ADDRESS=""
CONFIG_GATEWAY_DFU_ADDRESS_TYPE="random"
